<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
:root{--a:#30d158;--b:#64d2ff;--tab:#30d158;--tab2:#64d2ff;--ontab:#000;--btn:#30d158;--btn2:#64d2ff;--onbtn:#000;--bar:#30d158;--bar2:#64d2ff;--eq:#30d158;--eq2:#64d2ff;
--bg:0,0,0;--fg:#f5f5f7;--dim:#8e8e93;--op:.9;--blur:20px;--r:28px;--w:500px;--dur:.4s;--ease:cubic-bezier(.3,1.4,.5,1);--glow:none}
*{box-sizing:border-box;margin:0;user-select:none}
html,body{height:100%;background:transparent;overflow:hidden;font:13px/1.3 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--fg)}
#island{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:var(--pw,190px);height:34px;border-radius:20px;overflow:hidden;
 background:rgba(var(--bg),var(--op));backdrop-filter:blur(var(--blur));box-shadow:var(--glow);
 transition:width var(--dur) var(--ease),height var(--dur) var(--ease),border-radius var(--dur),box-shadow var(--dur)}
#island.open{width:var(--w);height:158px;border-radius:var(--r)}
#island[data-t=music].open{height:200px}#island[data-t=timer].open{height:206px}#island[data-t=tr].open{height:268px}#island[data-t=clock].open{height:var(--ch,292px)}
#island.open.settings{height:440px}
.pill{position:absolute;inset:0 0 auto 0;height:34px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap;cursor:pointer;transition:opacity .2s}
.open .pill{opacity:0;pointer-events:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 8px currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.pcov{width:18px;height:18px;border-radius:5px;background:center/cover}
.mini{display:none;gap:2px;align-items:flex-end;height:12px}.mini i{width:2px;background:var(--eq);height:3px;border-radius:1px}
.playing .mini{display:flex}.playing .mini i{animation:eq .7s infinite ease-in-out alternate}
.full{opacity:0;padding:12px 16px;transition:opacity .25s .1s;pointer-events:none;width:var(--w)}
.open .full{opacity:1;pointer-events:auto}
.tabs{display:flex;gap:5px;margin-bottom:10px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs.many .tab{padding:3px 6px;font-size:12px}
.tab{padding:4px 9px;flex:none;border-radius:12px;color:var(--dim);cursor:pointer;background:rgba(128,128,128,.15);transition:all .2s}
.tab:hover{transform:translateY(-1px);color:var(--fg)}
.tab.on{background:linear-gradient(90deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:600}
.ib{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;cursor:pointer;background:rgba(128,128,128,.15);color:var(--dim);transition:all .2s}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{transform:scale(1.1);color:var(--fg)}.ib.on{color:var(--a);background:color-mix(in srgb,var(--a) 22%,transparent)}
.push{margin-left:auto}.settings #v-center{display:none}.settings #gear{transform:rotate(60deg);color:var(--a)}
.hide{display:none!important}
.big{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.bar{height:6px;background:rgba(128,128,128,.2);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bar),var(--bar2));border-radius:3px;transition:width .6s}
#spark{width:100%;height:26px;margin-top:6px}#spark polyline{fill:none;stroke:var(--a);stroke-width:1.5;stroke-linejoin:round}
.clock{font-size:44px;font-weight:300;letter-spacing:-2px}.tmc{font-size:38px;line-height:1.15}
.cover{width:76px;height:76px;border-radius:14px;flex:none;position:relative;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;box-shadow:0 6px 18px -6px var(--a);transition:border-radius .4s}
.cover.nocov:after{content:"♪";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:rgba(0,0,0,.55)}
.playing .cover{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) scale(1.04)}}
.cs-vinyl .cover{border-radius:50%;animation:spin 6s linear infinite;animation-play-state:paused;box-shadow:0 0 0 3px #111,0 0 18px -2px var(--a)}
.cs-vinyl .cover:after{content:"";position:absolute;inset:31px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.playing.cs-vinyl .cover{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.music{display:flex;align-items:center;gap:14px}.mt{flex:1;min-width:0}
.mt .ti{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:2px;align-items:flex-end;height:26px;margin:6px 0}
.bars i{flex:1;border-radius:2px;background:linear-gradient(0deg,var(--eq),var(--eq2));height:3px}
.playing .bars.on i{animation:eq var(--d) infinite ease-in-out alternate;animation-delay:var(--dl)}
@keyframes eq{from{height:3px}to{height:var(--h)}}
.ctl{display:flex;align-items:center;gap:10px}
.cb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(128,128,128,.18);transition:transform .15s var(--ease),background .2s;position:relative}
.cb:hover{transform:scale(1.15);background:rgba(128,128,128,.32)}.cb:active{transform:scale(.8)}
.cb svg{width:15px;height:15px;fill:var(--fg)}
.cb.pp{width:42px;height:42px;background:linear-gradient(135deg,var(--btn),var(--btn2))}.cb.pp svg{fill:var(--onbtn);width:18px;height:18px}
.playing .cb.pp:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--btn);animation:ring 1.6s infinite}
@keyframes ring{to{transform:scale(1.7);opacity:0}}
.cb.pp .ic-pause{display:none}.playing .cb.pp .ic-pause{display:block}.playing .cb.pp .ic-play{display:none}
.vol{display:flex;align-items:center;gap:8px;margin-top:8px}.vol .ib{flex:none}.vol input{flex:1;accent-color:var(--a)}
.vol .n{width:30px;text-align:right;color:var(--dim);font-size:12px}
.toast{position:absolute;left:50%;bottom:8px;transform:translate(-50%,14px);padding:4px 12px;border-radius:12px;background:rgba(128,128,128,.35);opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.hot .dot{background:#ff453a!important;animation:shake .3s infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes breath{50%{box-shadow:0 0 30px 0 var(--a)}}.breath{animation:breath 2s infinite}
.ding{animation:shake .15s 14}
.unlocked .pill{cursor:grab}#island.drag{cursor:grabbing}
.tin{display:flex;gap:5px;align-items:center;margin:4px 0 6px}.tin span{color:var(--dim);font-size:12px;margin-right:4px}
.tin input{width:46px;background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:8px;padding:5px 6px;font:inherit;text-align:center}
.tin button,.chips button{background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:10px;padding:5px 10px;font:inherit;cursor:pointer;transition:transform .15s}
.tin button:hover,.chips button:hover{transform:scale(1.08)}.tin button:active,.chips button:active{transform:scale(.9)}
.tin #tgo{margin-left:auto;background:linear-gradient(90deg,var(--btn),var(--btn2));color:var(--onbtn);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button{padding:3px 9px}
.set{display:none;margin-top:10px;max-height:250px;overflow-y:auto;padding-right:6px;font-size:12px;flex-direction:column;gap:8px}
.settings .set{display:flex}
.set::-webkit-scrollbar{width:4px}.set::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:2px}
.set label{display:flex;align-items:center;gap:10px;color:var(--dim)}.set label>span:first-child{width:150px;flex:none}
.set input[type=range]{flex:1;accent-color:var(--a)}.set input[type=checkbox]{accent-color:var(--a)}
.set input[type=color]{width:46px;height:24px;border:0;background:none;padding:0;cursor:pointer}
.set select,.set button{background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:8px;padding:4px 8px;font:inherit;flex:1;cursor:pointer}
.set select option{color:#000}.set button.sm{flex:none}.set .q{color:#ff453a}
.hd{color:var(--fg);font-weight:600;margin-top:4px}
.sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}.sw:hover{transform:scale(1.25)}.sw.on{border-color:#fff}
#island[data-t=center].open{height:410px}
.seg{display:flex;gap:4px;margin-bottom:10px;padding:3px;background:rgba(128,128,128,.14);border-radius:12px}
.seg div{flex:1;text-align:center;padding:5px 0;border-radius:9px;color:var(--dim);cursor:pointer;transition:all .2s}
.seg div:hover{color:var(--fg)}.seg div.on{background:linear-gradient(90deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{height:60px;border-radius:18px;background:rgba(128,128,128,.14);padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:transform .18s var(--ease),background .25s,box-shadow .25s}
.tile:hover{transform:translateY(-2px) scale(1.03);background:rgba(128,128,128,.24)}.tile:active{transform:scale(.93)}
.tile svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-weight:600;font-size:12px;line-height:1.1;display:block}.tile small{display:block;font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:linear-gradient(135deg,var(--tab),var(--tab2));color:var(--ontab);box-shadow:0 6px 16px -6px var(--a)}
.tile.dg:hover{background:rgba(255,69,58,.3)}.tile.warn,.tile.warn:hover{background:#ff453a;color:#fff;animation:shake .25s 2}
.sl{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--dim)}
.sl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sl input{flex:1;accent-color:var(--a)}.sl span{width:30px;text-align:right;font-size:12px}
.pg{max-height:255px;overflow-y:auto;padding-right:4px}.pg::-webkit-scrollbar{width:4px}.pg::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:2px}
.addrow{display:flex;gap:6px;margin-bottom:8px}
.addrow input{flex:1;background:rgba(128,128,128,.18);color:var(--fg);border:0;border-radius:10px;padding:7px 10px;font:inherit;user-select:text}
.btn{background:linear-gradient(90deg,var(--btn),var(--btn2));color:var(--onbtn);border:0;border-radius:10px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s;white-space:nowrap}
.btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.92)}.btn.g{background:rgba(128,128,128,.2);color:var(--fg);font-weight:400}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(128,128,128,.12);margin-bottom:6px;animation:pop .25s var(--ease)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere;user-select:text}.item.done .tx{text-decoration:line-through;opacity:.5}
.item .ck{width:18px;height:18px;border-radius:6px;border:2px solid var(--dim);cursor:pointer;display:grid;place-items:center;flex:none;transition:all .2s}
.item.done .ck{background:var(--a);border-color:var(--a);color:#000}.item .ck svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;opacity:0}.item.done .ck svg{opacity:1}
.item .x{cursor:pointer;color:var(--dim);display:grid;place-items:center}.item .x:hover{color:#ff453a}
.item .x svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.item.clip{cursor:pointer;transition:background .2s}.item.clip:hover{background:rgba(128,128,128,.26)}.item.clip .x:hover{color:var(--a)}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;cursor:pointer;transition:transform .18s var(--ease),background .2s}
.app:hover{background:rgba(128,128,128,.2);transform:translateY(-2px)}.app:active{transform:scale(.92)}
.app .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:700;font-size:16px;overflow:hidden}
.app .ic.img{background:none}.app .ic img{width:100%;height:100%;object-fit:contain}
.app span{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .rm{position:absolute;top:2px;right:6px;width:16px;height:16px;border-radius:50%;background:#ff453a;color:#fff;display:none;place-items:center;font-size:12px;line-height:1}
.apps.edit .rm{display:grid}.apps.edit .app{animation:wob .25s infinite alternate}@keyframes wob{to{transform:rotate(2deg)}}
.empty{color:var(--dim);text-align:center;padding:26px 0}
#pin{display:inline-flex;align-items:center;gap:8px}#pin.multi .mini{display:none}
.pm{display:inline-flex;align-items:baseline;gap:4px;font-weight:600}.pm i{font-style:normal;font-weight:400;font-size:11px;color:var(--dim)}
.pm+.pm{margin-left:6px;padding-left:10px;border-left:1px solid rgba(128,128,128,.35)}
#island[data-t=dash].open{height:var(--dh,214px)}.settings #v-dash{display:none}
#island.open.settings[data-t]{height:440px}
.dgrid{display:grid;gap:8px;grid-auto-rows:62px}
.dc{position:relative;background:rgba(128,128,128,.14);border-radius:16px;padding:8px 12px;overflow:hidden;transition:background .25s}
.dc:hover{background:rgba(128,128,128,.22)}.dl{font-size:11px;color:var(--dim)}
.dv{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsp{position:absolute;right:10px;top:12px;width:42%;height:26px}.dsp polyline{fill:none;stroke:var(--a);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dc.hot .dv{color:#ff453a}.dc.hot .dsp polyline{stroke:#ff453a}.dc.f .dv{color:var(--a)}
.chipw{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 10px;border-radius:12px;background:rgba(128,128,128,.2);cursor:pointer;color:var(--fg);transition:all .2s}
.chip:hover{transform:translateY(-1px)}.chip.on{background:linear-gradient(90deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:600}
.note{color:var(--dim);font-size:11px;line-height:1.4}
.trta{flex:1;background:rgba(128,128,128,.18);color:var(--fg);border:0;border-radius:10px;padding:8px 10px;font:inherit;resize:none;height:48px;user-select:text;outline:none}
#v-tr{display:flex;flex-direction:column}
#tro{flex:1;min-height:44px;background:rgba(128,128,128,.12);border-radius:12px;padding:8px 12px;overflow-y:auto;margin:8px 0;user-select:text;line-height:1.35;font-size:13px}
#tro::-webkit-scrollbar{width:4px}#tro::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:2px}
#tro .dim{color:var(--dim);font-size:11px}
.calh{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.calh .ib{width:20px;height:20px;border-radius:7px}
.caln{font-size:12px;font-weight:600;text-transform:capitalize;min-width:110px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:6px;font-size:11px}
.cal div{padding:2px 0;border-radius:7px}
.cal .wd{color:var(--dim);font-size:10px}
.cal .d{color:var(--fg)}
.cal .out{opacity:.3}
.cal .td{background:linear-gradient(90deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:600}
</style></head>
<body>
<div id="island">
 <div class="pill" id="pill"><span class="pcov hide" id="pcov"></span><span id="pin"><span class="dot" id="dot"></span><span id="pt"></span><span class="mini"><i></i><i></i><i></i></span></span></div>
 <div class="full">
  <div class="tabs" id="tabs"></div>
  <div id="v-dash" class="hide"><div class="dgrid" id="dg"></div></div>
  <div id="v-stat"><div class="big" id="big"></div><div class="sub" id="sub"></div><div class="bar"><i id="fill"></i></div>
   <svg id="spark" viewBox="0 0 100 26" preserveAspectRatio="none"><polyline id="line"/></svg></div>
  <div id="v-clock" class="hide"><div class="clock" id="ck"></div><div class="sub" id="cd"></div><div id="cal"></div></div>
  <div id="v-timer" class="hide"><div class="clock tmc" id="tm"></div>
   <div class="tin"><input id="th" type="number" min="0" max="99"><span>ч</span><input id="tmi" type="number" min="0"><span>мин</span><input id="ts" type="number" min="0"><span>сек</span>
    <button id="tgo">Старт</button><button id="trs">Сброс</button></div>
   <div class="chips" id="chips"></div></div>
  <div id="v-music" class="hide">
   <div class="music"><div class="cover" id="cover"></div>
    <div class="mt"><div class="ti" id="mti"></div><div class="sub" id="mar"></div><div class="bars on" id="bars"></div>
     <div class="ctl">
      <div class="cb" data-m="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></div>
      <div class="cb pp" data-m="toggle"><svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></div>
      <div class="cb" data-m="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></div>
     </div></div></div>
   <div class="vol"><div class="ib" id="mute"></div><input type="range" id="vs" min="0" max="100"><span class="n" id="vl">0</span></div></div>
  <div id="v-tr" class="hide">
   <div class="addrow"><textarea id="tri" class="trta" placeholder="Текст для перевода" spellcheck="false"></textarea></div>
   <div class="seg" id="trl"></div>
   <div id="tro"><span class="dim" id="trt">Авто: с русского на английский, с других языков — на русский.</span></div>
   <div class="addrow"><button class="btn g" id="trc">Из буфера</button><button class="btn" id="trgo">Перевести</button><button class="btn g" id="trcp">Копировать</button><span class="sub" id="trsrc" style="flex:1;align-self:center;text-align:right"></span></div>
  </div>
  <div id="v-center" class="hide"><div class="seg" id="seg"></div><div id="cpg"></div></div>
  <div class="set" id="set"></div>
 </div>
 <div class="toast" id="toast"></div>
</div>
<script>
const { ipcRenderer: ipc } = require('electron');
const $ = id => document.getElementById(id), isl = $('island'), H = c => ipc.invoke('h', c);
const SV = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
 grid: SV('<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>'),
 wifi: SV('<path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/>'),
 bt: SV('<path d="M7 7l10 10-5 5V2l5 5L7 17"/>'),
 awake: SV('<path d="M17 8h1a3 3 0 0 1 0 6h-1M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM8 2v3M12 2v3"/>'),
 shot: SV('<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/>'),
 task: SV('<path d="M3 12h4l3-8 4 16 3-8h4"/>'),
 sleep: SV('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
 rest: SV('<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>'),
 power: SV('<path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/>'),
 out: SV('<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 8l4 4-4 4M20 12H9"/>'),
 chk: SV('<path d="M5 12l5 5 9-10"/>'), x: SV('<path d="M6 6l12 12M18 6L6 18"/>'),

setInterval(async () => { if (!S.clipOn) return; const t = await ipc.invoke('clip');
 if (t && t.trim() && t !== clips[0]) { clips = [t, ...clips.filter(c => c !== t)].slice(0, 12); if (S.tab === 'center' && S.cp === 'clip') renderClips(); } }, 1500);
S.apps.forEach(a => { if (!a.i && !/^https?:/i.test(a.p)) ipc.invoke('icon', a.p).then(d => { if (d) { a.i = d; save(); renderApps(); } }); });
if (S.awake) ipc.invoke('awake', true);

// ---- Показатели: капсула и панель ----
const KB = n => n < 1024 ? Math.round(n) + 'B' : n < 1048576 ? (n / 1024 | 0) + 'K' : (n / 1048576).toFixed(1) + 'M';
const fpsLive = () => !!(fpsd && fpsd.fps > 0 && Date.now() - fpsd.ts < 2500);
const fpsHint = () => !fpsSt ? 'Запусти игру' : !fpsSt.found ? 'Нужен PresentMon' : fpsSt.state === 'noaccess' ? 'Нет прав для FPS' : fpsSt.state === 'off' ? 'FPS выключен' : 'Запусти игру';
function fpsText() {
 if (!fpsSt) return ''; if (!fpsSt.found) return 'PresentMon не найден: положи PresentMon*.exe в папку по кнопке ниже.';
 return { running:'Работает. ' + (fpsLive() ? `Сейчас: ${fpsd.app}, ${fpsd.fps} FPS` : 'Запусти игру.'), starting:'Запускаю…', off:'Выключено',
  noaccess:'Нет прав. Нажми «Выдать права», затем перезайди в Windows.', error:'Ошибка PresentMon: ' + (fpsSt.msg || '') }[fpsSt.state] || '';
}
const MET = {
 cpu: { n:'CPU', s:'CPU', v:() => data.cpu ? data.cpu.load + '%' : null, p:() => data.cpu ? data.cpu.load : 0, h:'cpu', max:100, sub:() => data.cpu ? data.cpu.name : '' },
 gpu: { n:'GPU', s:'GPU', v:() => data.gpu ? data.gpu.load + '%' : null, p:() => data.gpu ? data.gpu.load : 0, h:'gpu', max:100, sub:() => data.gpu ? data.gpu.name : 'Нет данных' },
 temp: { n:'GPU °C', s:'°C', v:() => data.gpu && data.gpu.temp ? data.gpu.temp + '°' : null, p:() => data.gpu && data.gpu.temp > 85 ? 100 : 0, h:'temp', max:100, sub:() => 'Температура видеокарты' },
 ram: { n:'RAM', s:'RAM', v:() => data.cpu ? data.cpu.ramUsed + '%' : null, p:() => data.cpu ? data.cpu.ramUsed : 0, h:'ram', max:100, sub:() => data.cpu ? `${data.cpu.ramGb} / ${data.cpu.ramTotal} ГБ` : '' },
 disk: { n:'Диск', s:'Диск', v:() => data.cpu && data.cpu.disk != null ? data.cpu.disk + '%' : null, p:() => data.cpu && data.cpu.disk || 0, sub:() => 'Занято на системном диске' },
 fps: { n:'FPS', s:'FPS', f:1, v:() => fpsLive() ? String(fpsd.fps) : null, h:'fps', max:() => S.fpsMax, sub:() => fpsLive() ? `${fpsd.app} · 1% low ${fpsd.low}` : fpsHint() },
 net: { n:'Сеть', s:'', v:() => net ? '↓' + KB(net.d) + ' ↑' + KB(net.u) : null, h:'net', max:() => Math.max(102400, ...hist.net), sub:() => 'Скорость сети' },
 bat: { n:'Батарея', s:'Бат', v:() => bat ? Math.round(bat.level * 100) + '%' : null, sub:() => bat ? (bat.charging ? 'Заряжается' : 'От батареи') : 'Нет батареи' },
 time: { n:'Время', s:'', v:() => { const d = new Date(); return S.h24 ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }); }, sub:() => new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' }) },
 track: { n:'Трек', s:'', v:() => data.music && data.music.title ? data.music.title.slice(0, 24) : null, sub:() => data.music ? data.music.artist || '' : 'Ничего не играет' },
 weather: { n:'Погода', s:'Пог', v:() => wx && S.wxOn ? (wx.t > 0 ? '+' : '') + Math.round(wx.t) + '°' : null, sub:() => wx ? `${WXT[wx.code] || ''}${wx.wind >= 5 ? ' · ' + Math.round(wx.wind) + ' м/с' : ''}${wx.city ? ' · ' + wx.city : ''}` : 'Включи погоду в настройках' },
 fx: { n:'Курс', s:'$', v:() => fx && fx.ok ? '$ ' + fx.usd.toFixed(2).replace('.', ',') : null, sub:() => fx && fx.ok ? '€ ' + fx.eur.toFixed(2).replace('.', ',') + ' · ЦБ РФ' : 'Нет данных' }
};
function pillMetrics() {
 return S.pillM.filter(k => MET[k] && MET[k].v() != null && !(k === 'fps' && S.fpsHide && !fpsLive()))
  .map(k => `<span class="pm"><i>${MET[k].s}</i>${esc(MET[k].v())}</span>`).join('');
}
function renderDash() {
 const ks = S.dash.filter(k => MET[k]), el = $('dg'), cols = ks.length <= 1 ? 1 : ks.length <= 4 ? 2 : 3, rows = Math.max(1, Math.ceil(ks.length / cols));
 el.style.gridTemplateColumns = `repeat(${cols},1fr)`; isl.style.setProperty('--dh', (rows * 70 + 54) + 'px');
 el.innerHTML = ks.length ? ks.map(k => {
  const m = MET[k], v = m.v(), h = m.h && hist[m.h], mx = typeof m.max === 'function' ? m.max() : (m.max || 100);
  const pts = h && h.length > 1 ? h.map((y, i) => `${(40 - h.length + i) * 100 / 39},${19 - Math.min(1, y / mx) * 18}`).join(' ') : '';
  return `<div class="dc ${m.p && m.p() > 90 ? 'hot' : ''} ${m.f ? 'f' : ''}"><div class="dl">${m.n}</div><div class="dv">${v == null ? '—' : esc(v)}</div>${pts ? `<svg class="dsp" viewBox="0 0 100 20" preserveAspectRatio="none"><polyline points="${pts}"/></svg>` : ''}<div class="ds">${esc(m.sub() || '')}</div></div>`;
 }).join('') : '<div class="empty" style="grid-column:1/-1">Выбери показатели в настройках</div>';
}
function renderChips() {
 document.querySelectorAll('[data-chips]').forEach(el => { const key = el.dataset.chips;
  el.innerHTML = Object.entries(MET).map(([k, m]) => `<span class="chip ${S[key].includes(k) ? 'on' : ''}" data-chip="${key}:${k}">${m.n}</span>`).join(''); });
}
function fitPill() { requestAnimationFrame(() => { const w = Math.round(Math.max(130, $('pin').offsetWidth + 34));
 if (Math.abs(w - lastPw) > 2) { lastPw = w; isl.style.setProperty('--pw', Math.min(w, S.width) + 'px'); } }); }
setInterval(async () => { const f = await ipc.invoke('fps'); fpsd = f ? { ...f, ts: Date.now() } : null; if (f) push('fps', f.fps);
 if (f || S.tab === 'dash' || S.pillM.includes('fps')) update(); }, 700);
setInterval(() => ipc.invoke('fps-status').then(s => { fpsSt = s; const e = $('fpss'); if (e) e.textContent = fpsText(); }), 3000);
setInterval(async () => {
 if (!S.pillM.includes('net') && !S.dash.includes('net')) return;
 const m = /^N (\d+) (\d+)/.exec(await H('net') || ''); if (!m) return; const now = Date.now(), rx = +m[1], tx = +m[2];
 if (netPrev) { const dt = (now - netPrev.t) / 1000; net = { d: Math.max(0, (rx - netPrev.rx) / dt), u: Math.max(0, (tx - netPrev.tx) / dt) }; push('net', net.d); }
 netPrev = { t: now, rx, tx };
}, 1000);
ipc.on('hotkey', () => { pinned = !pinned;
 if (pinned) { open(); ipc.send('mouse-over-island', true); } else { isl.classList.remove('open', 'settings'); ipc.send('mouse-over-island', !!hov); } });
ipc.invoke('fps-ctl', { on: S.fpsOn, noBrowsers: S.fpsBr }); ipc.send('hotkey', S.hotkey);

// ---- Переводчик ----
const trRender = () => { $('trl').innerHTML = [['auto','Авто'],['en','EN'],['de','DE'],['fr','FR'],['es','ES'],['uk','UA'],['it','IT']]
 .map(([l, n]) => `<div class="${S.trLang === l ? 'on' : ''}" data-l="${l}">${n}</div>`).join(''); };
trRender();
$('trl').onclick = e => { const l = e.target.dataset.l; if (l) { S.trLang = l; save(); trRender(); } };
let trBusy = false, trLast = '';
async function doTr(t) {
 t = String(t || '').trim(); if (!t || trBusy) return;
 trBusy = true; $('trt').innerHTML = '<span class="dim">Перевожу…</span>'; $('trsrc').textContent = '';
 const to = S.trLang === 'auto' ? (/[а-яё]/i.test(t) ? 'en' : 'ru') : S.trLang;
 try { const r = await ipc.invoke('translate', t, to);
  if (r && r.ok) { trLast = r.text; $('trt').textContent = r.text; $('trsrc').textContent = (r.src || '?') + ' → ' + to; }
  else $('trt').innerHTML = '<span class="dim">Не получилось перевести. Проверь интернет.</span>';
 } catch { $('trt').innerHTML = '<span class="dim">Ошибка сети</span>'; } finally { trBusy = false; }
}
$('trgo').onclick = () => doTr($('tri').value);
$('tri').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doTr(e.target.value); } });
$('trc').onclick = async () => { const c = await ipc.invoke('clip'); if (c && c.trim()) { $('tri').value = c.trim(); doTr(c); } else showToast('Буфер пуст'); };
$('trcp').onclick = () => { if (trLast) { ipc.invoke('clip-set', trLast); showToast('Скопировано'); } };

// ---- Погода ----
const WXE = { 0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',56:'🌧️',57:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️' };
const WXT = { 0:'Ясно',1:'Малооблачно',2:'Переменная облачность',3:'Облачно',45:'Туман',48:'Изморозь',51:'Морось',53:'Морось',55:'Сильная морось',56:'Ледяная морось',57:'Ледяная морось',61:'Небольшой дождь',63:'Дождь',65:'Сильный дождь',66:'Ледяной дождь',67:'Ледяной дождь',71:'Небольшой снег',73:'Снег',75:'Сильный снег',77:'Снежные зёрна',80:'Ливни',81:'Ливни',82:'Сильные ливни',85:'Снегопад',86:'Снегопад',95:'Гроза',96:'Гроза с градом',99:'Гроза с градом' };
let wx = null; try { const cw = JSON.parse(localStorage.getItem('island2wx') || 'null'); if (cw && Date.now() - cw.t < 3600000) wx = cw.w; } catch {}
async function pollWx() { if (!S.wxOn) return; try { const w = await ipc.invoke('wx', S.wxCity);
 if (w && w.ok) { wx = w; localStorage.setItem('island2wx', JSON.stringify({ t: Date.now(), w })); update(); } } catch {} }
let wxGeoList = [];
function renderWxGeo() { const el = $('wxr'); if (el) el.innerHTML = wxGeoList.map((g, i) => `<span class="chip" data-wg="${i}">${esc(g.n)}</span>`).join(''); }
pollWx(); setInterval(pollWx, 600000);

// ---- Курсы валют ----
let fx = null; try { const cf = JSON.parse(localStorage.getItem('island2fx') || 'null'); if (cf && Date.now() - cf.t < 86400000) fx = cf.r; } catch {}
async function pollFx() { try { const r = await ipc.invoke('fx'); if (r) { fx = r; localStorage.setItem('island2fx', JSON.stringify({ t: Date.now(), r })); if (S.tab === 'dash' || S.pillM.includes('fx') || S.tab === 'clock') update(); } } catch {} }
pollFx(); setInterval(pollFx, 1800000);

theme(); sync(); tabs(); update(); rotate(); tmUi(); volUi(); if (S.tab === 'center') page();
</script></body></html>
