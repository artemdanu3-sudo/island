<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
:root{--a:#30d158;--b:#64d2ff;--tab:#30d158;--tab2:#64d2ff;--ontab:#000;--btn:#30d158;--btn2:#64d2ff;--onbtn:#000;--bar:#30d158;--bar2:#64d2ff;--eq:#30d158;--eq2:#64d2ff;
--bg:0,0,0;--fg:#f5f5f7;--dim:#8e8e93;--op:.9;--blur:20px;--r:28px;--w:440px;--dur:.4s;--ease:cubic-bezier(.3,1.4,.5,1);--glow:none}
*{box-sizing:border-box;margin:0;user-select:none}
html,body{height:100%;background:transparent;overflow:hidden;font:13px/1.3 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--fg)}
#island{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:190px;height:34px;border-radius:20px;overflow:hidden;
 background:rgba(var(--bg),var(--op));backdrop-filter:blur(var(--blur));box-shadow:var(--glow);
 transition:width var(--dur) var(--ease),height var(--dur) var(--ease),border-radius var(--dur),box-shadow var(--dur)}
#island.open{width:var(--w);height:158px;border-radius:var(--r)}
#island[data-t=music].open{height:200px}#island[data-t=timer].open{height:206px}
#island.open.settings{height:440px}
.pill{position:absolute;inset:0 0 auto 0;height:34px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap;cursor:pointer;transition:opacity .2s}
.open .pill{opacity:0;pointer-events:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 8px currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.pcov{width:18px;height:18px;border-radius:5px;background:center/cover}
.mini{display:none;gap:2px;align-items:flex-end;height:12px}.mini i{width:2px;background:var(--eq);height:3px;border-radius:1px}
.playing .mini{display:flex}.playing .mini i{animation:eq .7s infinite ease-in-out alternate}
.full{opacity:0;padding:12px 16px;transition:opacity .25s .1s;pointer-events:none;width:var(--w)}
.open .full{opacity:1;pointer-events:auto}
.tabs{display:flex;gap:5px;margin-bottom:10px;align-items:center}
.tab{padding:4px 11px;border-radius:12px;color:var(--dim);cursor:pointer;background:rgba(128,128,128,.15);transition:all .2s}
.tab:hover{transform:translateY(-1px);color:var(--fg)}
.tab.on{background:linear-gradient(90deg,var(--tab),var(--tab2));color:var(--ontab);font-weight:600}
.ib{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;cursor:pointer;background:rgba(128,128,128,.15);color:var(--dim);transition:all .2s}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{transform:scale(1.1);color:var(--fg)}.ib.on{color:var(--a);background:color-mix(in srgb,var(--a) 22%,transparent)}
.lock{margin-left:auto}.settings #gear{transform:rotate(60deg);color:var(--a)}
.hide{display:none!important}
.big{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.bar{height:6px;background:rgba(128,128,128,.2);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bar),var(--bar2));border-radius:3px;transition:width .6s}
#spark{width:100%;height:26px;margin-top:6px}#spark polyline{fill:none;stroke:var(--a);stroke-width:1.5;stroke-linejoin:round}
.clock{font-size:44px;font-weight:300;letter-spacing:-2px}.tmc{font-size:38px;line-height:1.15}
.cover{width:76px;height:76px;border-radius:14px;flex:none;position:relative;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;box-shadow:0 6px 18px -6px var(--a);transition:border-radius .4s}
.playing .cover{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) scale(1.04)}}
.cs-vinyl .cover{border-radius:50%;animation:spin 6s linear infinite;animation-play-state:paused;box-shadow:0 0 0 3px #111,0 0 18px -2px var(--a)}
.cs-vinyl .cover:after{content:"";position:absolute;inset:31px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.playing.cs-vinyl .cover{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.music{display:flex;align-items:center;gap:14px}.mt{flex:1;min-width:0}
.mt .ti{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:2px;align-items:flex-end;height:26px;margin:6px 0}
.bars i{flex:1;border-radius:2px;background:linear-gradient(0deg,var(--eq),var(--eq2));height:3px}
.playing .bars.on i{animation:eq var(--d) infinite ease-in-out alternate;animation-delay:var(--dl)}
@keyframes eq{from{height:3px}to{height:var(--h)}}
.ctl{display:flex;align-items:center;gap:10px}
.cb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(128,128,128,.18);transition:transform .15s var(--ease),background .2s;position:relative}
.cb:hover{transform:scale(1.15);background:rgba(128,128,128,.32)}.cb:active{transform:scale(.8)}
.cb svg{width:15px;height:15px;fill:var(--fg)}
.cb.pp{width:42px;height:42px;background:linear-gradient(135deg,var(--btn),var(--btn2))}.cb.pp svg{fill:var(--onbtn);width:18px;height:18px}
.playing .cb.pp:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--btn);animation:ring 1.6s infinite}
@keyframes ring{to{transform:scale(1.7);opacity:0}}
.cb.pp .ic-pause{display:none}.playing .cb.pp .ic-pause{display:block}.playing .cb.pp .ic-play{display:none}
.vol{display:flex;align-items:center;gap:8px;margin-top:8px}.vol .ib{flex:none}.vol input{flex:1;accent-color:var(--a)}
.vol .n{width:30px;text-align:right;color:var(--dim);font-size:12px}
.toast{position:absolute;left:50%;bottom:8px;transform:translate(-50%,14px);padding:4px 12px;border-radius:12px;background:rgba(128,128,128,.35);opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.hot .dot{background:#ff453a!important;animation:shake .3s infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes breath{50%{box-shadow:0 0 30px 0 var(--a)}}.breath{animation:breath 2s infinite}
.ding{animation:shake .15s 14}
.unlocked .pill{cursor:grab}#island.drag{cursor:grabbing}
.tin{display:flex;gap:5px;align-items:center;margin:4px 0 6px}.tin span{color:var(--dim);font-size:12px;margin-right:4px}
.tin input{width:46px;background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:8px;padding:5px 6px;font:inherit;text-align:center}
.tin button,.chips button{background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:10px;padding:5px 10px;font:inherit;cursor:pointer;transition:transform .15s}
.tin button:hover,.chips button:hover{transform:scale(1.08)}.tin button:active,.chips button:active{transform:scale(.9)}
.tin #tgo{margin-left:auto;background:linear-gradient(90deg,var(--btn),var(--btn2));color:var(--onbtn);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button{padding:3px 9px}
.set{display:none;margin-top:10px;max-height:250px;overflow-y:auto;padding-right:6px;font-size:12px;flex-direction:column;gap:8px}
.settings .set{display:flex}
.set::-webkit-scrollbar{width:4px}.set::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:2px}
.set label{display:flex;align-items:center;gap:10px;color:var(--dim)}.set label>span:first-child{width:150px;flex:none}
.set input[type=range]{flex:1;accent-color:var(--a)}.set input[type=checkbox]{accent-color:var(--a)}
.set input[type=color]{width:46px;height:24px;border:0;background:none;padding:0;cursor:pointer}
.set select,.set button{background:rgba(128,128,128,.2);color:var(--fg);border:0;border-radius:8px;padding:4px 8px;font:inherit;flex:1;cursor:pointer}
.set select option{color:#000}.set button.sm{flex:none}.set .q{color:#ff453a}
.hd{color:var(--fg);font-weight:600;margin-top:4px}
.sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}.sw:hover{transform:scale(1.25)}.sw.on{border-color:#fff}
</style></head>
<body>
<div id="island">
 <div class="pill" id="pill"><span class="pcov hide" id="pcov"></span><span class="dot" id="dot"></span><span id="pt"></span><span class="mini"><i></i><i></i><i></i></span></div>
 <div class="full">
  <div class="tabs" id="tabs"></div>
  <div id="v-stat"><div class="big" id="big"></div><div class="sub" id="sub"></div><div class="bar"><i id="fill"></i></div>
   <svg id="spark" viewBox="0 0 100 26" preserveAspectRatio="none"><polyline id="line"/></svg></div>
  <div id="v-clock" class="hide"><div class="clock" id="ck"></div><div class="sub" id="cd"></div></div>
  <div id="v-timer" class="hide"><div class="clock tmc" id="tm"></div>
   <div class="tin"><input id="th" type="number" min="0" max="99"><span>ч</span><input id="tmi" type="number" min="0"><span>мин</span><input id="ts" type="number" min="0"><span>сек</span>
    <button id="tgo">Старт</button><button id="trs">Сброс</button></div>
   <div class="chips" id="chips"></div></div>
  <div id="v-music" class="hide">
   <div class="music"><div class="cover" id="cover"></div>
    <div class="mt"><div class="ti" id="mti"></div><div class="sub" id="mar"></div><div class="bars on" id="bars"></div>
     <div class="ctl">
      <div class="cb" data-m="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></div>
      <div class="cb pp" data-m="toggle"><svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></div>
      <div class="cb" data-m="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></div>
     </div></div></div>
   <div class="vol"><div class="ib" id="mute"></div><input type="range" id="vs" min="0" max="100"><span class="n" id="vl">0</span></div></div>
  <div class="set" id="set"></div>
 </div>
 <div class="toast" id="toast"></div>
</div>
<script>
const { ipcRenderer: ipc } = require('electron');
const $ = id => document.getElementById(id), isl = $('island'), H = c => ipc.invoke('h', c);
const SV = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
 lock: SV('<rect x="5" y="11" width="14" height="9" rx="2.5" fill="currentColor" fill-opacity=".3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
 unlock: SV('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/>'),
 gear: SV('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'),
 spk: (v, m) => SV('<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" fill-opacity=".3"/>' + (m || !v ? '<path d="M17 9.5l4 5M21 9.5l-4 5"/>' : (v > 0 ? '<path d="M16 9.5a4 4 0 0 1 0 5"/>' : '') + (v > 45 ? '<path d="M18.5 6.8a8 8 0 0 1 0 10.4"/>' : '')))
};
const T = { 'Зелёный':['#30d158','#64d2ff','0,0,0'],'Голубой':['#64d2ff','#0a84ff','6,10,18'],'Розовый':['#ff6bb5','#bf5af2','20,8,16'],
 'Оранжевый':['#ff9f0a','#ff453a','18,12,4'],'Фиолетовый':['#bf5af2','#5e5ce6','14,8,22'],'Красный':['#ff453a','#ff9f0a','20,6,6'],
 'Бирюзовый':['#40e0d0','#30d158','4,16,16'],'Лайм':['#c6ff00','#30d158','8,14,4'],'Золото':['#ffd60a','#ff9f0a','18,14,2'],
 'Неон':['#00ffd5','#ff00e5','0,0,12'],'Закат':['#ff7e5f','#feb47b','22,10,10'],'Лёд':['#e0f7ff','#64d2ff','10,16,24'],'Белый':['#1c1c1e','#636366','245,245,247'] };
const TABS = { cpu:'CPU', gpu:'GPU', ram:'RAM', clock:'Часы', timer:'Таймер', music:'Музыка' };
const COLS = [['a','Основной (точка, график)'],['b','Второй цвет градиента'],['tab','Активная вкладка'],['btn','Кнопка Play и Старт'],['bar','Полоса нагрузки'],['eq','Эквалайзер'],['bg','Фон острова'],['fg','Текст']];
const DEF = { tab:'cpu', theme:'Зелёный', c:{}, grad:true, opacity:90, blur:20, radius:28, width:440, speed:100, anim:'spring', open:'hover', rotate:0,
 glow:false, spark:true, eq:true, h24:true, locked:false, cover:'square', artColor:false, wheel:true, alert:true, dotLoad:false, sound:'beep', pos:null,

const S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('island2') || '{}'));
S.tabs = Object.assign({}, DEF.tabs, S.tabs); S.c = S.c || {};
const save = () => localStorage.setItem('island2', JSON.stringify(S));
const data = {}, hist = { cpu:[], gpu:[], ram:[] };
let artC = '', coverB = '', tRun = 0, tLeft = 1500, tSet = 1500, hov = 0, jd = false, dr = null, vol = 50, muted = 0, volUntil = 0, doneUntil = 0, optUntil = 0, bat = null;
const EASE = { spring:'cubic-bezier(.3,1.4,.5,1)', smooth:'cubic-bezier(.4,0,.2,1)', none:'linear' };
const cx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const rgb = c => { cx.fillStyle = '#000'; cx.fillStyle = c; cx.clearRect(0,0,1,1); cx.fillRect(0, 0, 1, 1); const d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; };
const hex = c => '#' + rgb(c).map(x => x.toString(16).padStart(2, '0')).join('');
const on = c => { const [r, g, b] = rgb(c); return .299 * r + .587 * g + .114 * b > 150 ? '#000' : '#fff'; };
const dflt = k => { const t = T[S.theme] || T['Зелёный'], a = S.artColor && artC ? artC : t[0];
 return k === 'a' ? a : k === 'b' ? t[1] : k === 'bg' ? `rgb(${t[2]})` : k === 'fg' ? (S.theme === 'Белый' ? '#111' : '#f5f5f7') : S.c.a || a; };

function theme() {
 const r = document.documentElement.style, C = S.c, t = T[S.theme] || T['Зелёный'];
 const a = C.a || (S.artColor && artC) || t[0], b = !S.grad ? a : (C.b || (C.a || (S.artColor && artC) ? a : t[1]));
 r.setProperty('--a', a); r.setProperty('--b', b);
 for (const k of ['tab', 'btn', 'bar', 'eq']) { const c1 = C[k] || a, c2 = !S.grad || C[k] ? c1 : b;
  r.setProperty('--' + k, c1); r.setProperty('--' + k + '2', c2); if (k === 'tab' || k === 'btn') r.setProperty('--on' + k, on(c1)); }
 r.setProperty('--bg', C.bg ? rgb(C.bg).join(',') : t[2]);
 const fg = C.fg || dflt('fg'); r.setProperty('--fg', fg); r.setProperty('--dim', `color-mix(in srgb, ${fg} 55%, transparent)`);
 r.setProperty('--op', S.opacity / 100); r.setProperty('--blur', S.blur + 'px'); r.setProperty('--r', S.radius + 'px');
 r.setProperty('--w', S.width + 'px'); r.setProperty('--ease', EASE[S.anim]);
 r.setProperty('--dur', S.anim === 'none' ? '0s' : (0.4 / (S.speed / 100)).toFixed(2) + 's');
 r.setProperty('--glow', S.glow ? `0 0 22px -4px ${a}` : 'none');
 $('bars').classList.toggle('on', !!S.eq); $('v-music').classList.toggle('cs-vinyl', S.cover === 'vinyl'); isl.classList.toggle('unlocked', !S.locked);
}
const visible = () => Object.keys(TABS).filter(k => S.tabs[k]);
function tabs() {
 if (!visible().includes(S.tab)) S.tab = visible()[0] || 'cpu';
 $('tabs').innerHTML = visible().map(k => `<div class="tab ${S.tab === k ? 'on' : ''}" data-k="${k}">${TABS[k]}</div>`).join('') +
  `<div class="ib lock ${S.locked ? 'on' : ''}" id="lock" title="${S.locked ? 'Закреплён. Нажми, чтобы открепить' : 'Можно двигать. Нажми, чтобы закрепить'}">${ICON[S.locked ? 'lock' : 'unlock']}</div><div class="ib" id="gear" title="Настройки">${ICON.gear}</div>`;
 $('tabs').querySelectorAll('.tab').forEach(e => e.onclick = () => { S.tab = e.dataset.k; save(); tabs(); update(); });
 $('gear').onclick = () => isl.classList.toggle('settings');
 $('lock').onclick = () => { S.locked = !S.locked; save(); sync(); tabs(); };
 theme();
}
const pad = n => String(n).padStart(2, '0');
const fmt = s => (s >= 3600 ? pad(s / 3600 | 0) + ':' : '') + pad((s % 3600) / 60 | 0) + ':' + pad(s % 60);
function update() {
 const k = S.tab, st = k === 'cpu' || k === 'gpu' || k === 'ram';
 $('v-stat').classList.toggle('hide', !st); $('v-clock').classList.toggle('hide', k !== 'clock'); $('v-timer').classList.toggle('hide', k !== 'timer');
 $('v-music').classList.toggle('hide', k !== 'music'); isl.dataset.t = k;
 let p = TABS[k], lv = null; const c = data.cpu, g = data.gpu;
 if (st) {
  const v = k === 'cpu' ? c && { l:c.load, s:`${c.name} · RAM ${c.ramUsed}%` } : k === 'gpu' ? g && { l:g.load, s:`${g.name}${g.temp ? ' · ' + g.temp + '°C' : ''}` }
   : c && { l:c.ramUsed, s:`${c.ramGb} / ${c.ramTotal} ГБ занято` };
  if (v) { lv = v.l; $('big').textContent = v.l + '%'; $('sub').textContent = v.s; $('fill').style.width = v.l + '%'; p = `${TABS[k]} ${v.l}%`;
   $('line').setAttribute('points', hist[k].map((y, i) => `${i * 100 / 39},${25 - y * 24 / 100}`).join(' '));
  } else { $('big').textContent = '—'; $('sub').textContent = 'Нет данных (GPU: нужна NVIDIA или счётчики Windows)'; $('fill').style.width = 0; }
  $('spark').style.display = S.spark ? '' : 'none';
 }
 if (k === 'clock') { const d = new Date();
  $('ck').textContent = S.h24 ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  $('cd').textContent = d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' }) + (bat ? ` · батарея ${Math.round(bat.level * 100)}%${bat.charging ? ', заряжается' : ''}` : '');
  p = $('ck').textContent; }
 const m = data.music, pl = m && m.status === 'Playing';
 $('v-music').classList.toggle('playing', !!pl); $('pill').classList.toggle('playing', !!pl && k === 'music');
 $('mti').textContent = m ? (m.title || 'Без названия') : 'Ничего не играет';
 $('mar').textContent = m ? [m.artist, (m.app || '').replace(/\.exe$/i, '').split(/[!_]/)[0]].filter(Boolean).join(' · ') : 'Запусти музыку';
 if (k === 'music') p = m ? (m.title || '').slice(0, 22) : 'Музыка';
 if (tRun) p = 'Таймер ' + fmt(tLeft);
 if (Date.now() < doneUntil) p = 'Время вышло!';
 if (Date.now() < volUntil) p = 'Громкость ' + (muted ? 'выкл' : vol + '%');
 $('pt').textContent = p; $('pcov').classList.toggle('hide', !(k === 'music' && coverB));
 $('dot').style.background = S.dotLoad && lv != null ? `hsl(${120 - lv * 1.2},80%,55%)` : '';

 isl.classList.toggle('hot', !!(S.alert && ((c && c.load > 90) || (g && g.load > 90))));
 isl.classList.toggle('breath', !!(S.glow && pl));
}
$('bars').innerHTML = Array.from({ length: 28 }, () => `<i style="--d:${(.35 + Math.random() * .6).toFixed(2)}s;--dl:-${Math.random().toFixed(2)}s;--h:${6 + Math.random() * 20 | 0}px"></i>`).join('');

// ---- обложка ----
function setCover(b) {
 coverB = b || ''; const u = coverB ? `url(data:image/png;base64,${coverB})` : '';
 $('cover').style.backgroundImage = u; $('pcov').style.backgroundImage = u; artTheme(coverB); update();
}
function artTheme(b) {
 if (!S.artColor || !b) { artC = ''; theme(); return; }
 const im = new Image(); im.onload = () => {
  const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 8, 8);
  const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, bl = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { const w = 1 + (Math.max(d[i], d[i+1], d[i+2]) - Math.min(d[i], d[i+1], d[i+2])) / 32; r += d[i]*w; g += d[i+1]*w; bl += d[i+2]*w; n += w; }
  r /= n; g /= n; bl /= n; const f = Math.max(r, g, bl) < 150 ? 150 / Math.max(r, g, bl, 1) : 1;
  artC = `rgb(${Math.min(255, r*f)|0},${Math.min(255, g*f)|0},${Math.min(255, bl*f)|0})`; theme();
 }; im.src = 'data:image/png;base64,' + b;
}

// ---- музыка и громкость ----
let mBusy = false;
async function pollMusic() {
 if (mBusy) return; mBusy = true;
 try {
  let m = null; try { m = JSON.parse(await H('music')); } catch {}
  if (m && Date.now() < optUntil && data.music) m.status = data.music.status;
  data.music = m;
  if (m && 'art' in m) setCover(m.art); else if (!m && coverB) setCover('');
  update();
 } finally { mBusy = false; }
}
document.querySelectorAll('[data-m]').forEach(e => e.onclick = () => {
 const k = e.dataset.m; H('ctl ' + k);
 if (k === 'toggle' && data.music) { data.music.status = data.music.status === 'Playing' ? 'Paused' : 'Playing'; optUntil = Date.now() + 1200; update(); }
 [300, 900, 1800].forEach(d => setTimeout(pollMusic, d));
});
function volUi() { $('vs').value = vol; $('vl').textContent = vol; $('mute').innerHTML = ICON.spk(vol, muted); $('mute').classList.toggle('on', !!muted); }
function applyVol(s) { if (!s || Date.now() < volUntil) return; const [, v, m] = s.split(' '); vol = +v; muted = +m; volUi(); }
function setVol(n) {
 n = Math.max(0, Math.min(100, Math.round(n))); vol = n; volUntil = Date.now() + 1500; H('vol set ' + n);
 if (muted && n) { muted = 0; H('vol mute 0'); }
 volUi(); showToast('Громкость ' + n + '%'); update();
}
let tt; function showToast(s) { $('toast').textContent = s; $('toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('on'), 1000); }
$('vs').oninput = e => setVol(+e.target.value);

isl.addEventListener('wheel', e => { if (!S.wheel || e.target.closest('.set,input[type=number]')) return; setVol(vol + (e.deltaY < 0 ? 5 : -5)); });

// ---- таймер ----
function tmUi(fromIn) {
 const h = tLeft / 3600 | 0, m = (tLeft % 3600) / 60 | 0, s = tLeft % 60;
 $('tm').textContent = fmt(tLeft); $('tgo').textContent = tRun ? 'Пауза' : 'Старт';
 if (!fromIn) [['th', h], ['tmi', m], ['ts', s]].forEach(([i, v]) => { if (document.activeElement !== $(i)) $(i).value = v; });
}
$('chips').innerHTML = [[60,'1 мин'],[300,'5 мин'],[600,'10 мин'],[900,'15 мин'],[1500,'25 мин'],[2700,'45 мин'],[3600,'1 час']].map(([s, n]) => `<button data-tm="${s}">${n}</button>`).join('');
document.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { tSet = tLeft = +b.dataset.tm; tRun = 0; tmUi(); update(); });
['th', 'tmi', 'ts'].forEach(i => $(i).oninput = () => { if (tRun) return;
 tSet = tLeft = Math.max(0, (+$('th').value || 0) * 3600 + (+$('tmi').value || 0) * 60 + (+$('ts').value || 0)); tmUi(true); update(); });
$('tgo').onclick = () => { if (tLeft <= 0) tLeft = tSet; if (tLeft > 0) tRun = !tRun; tmUi(); update(); };
$('trs').onclick = () => { tLeft = tSet; tRun = 0; tmUi(); update(); };
function ring() { if (S.sound === 'none') return; try { const c = new AudioContext();
 const tn = (f, t, d, ty = 'sine', v = .25) => { const o = c.createOscillator(), g = c.createGain(); o.type = ty; o.frequency.value = f; o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(v, c.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + d); o.start(c.currentTime + t); o.stop(c.currentTime + t + d + .02); };
 if (S.sound === 'bell') [0, .5, 1].forEach(t => { tn(1318, t, 1.2); tn(1976, t, .8, 'sine', .1); });
 else if (S.sound === 'alarm') for (let i = 0; i < 8; i++) tn(i % 2 ? 700 : 1000, i * .25, .2, 'square', .12);
 else [0, .3, .6].forEach(t => tn(880, t, .25)); } catch {} }
setInterval(() => { if (!tRun) return; tLeft--;
 if (tLeft <= 0) { tLeft = 0; tRun = 0; ring(); doneUntil = Date.now() + 6000; open(); isl.classList.add('ding');
  setTimeout(() => { isl.classList.remove('ding'); if (!hov) isl.classList.remove('open', 'settings'); update(); }, 6000); }
 tmUi(); update(); }, 1000);

// ---- опросы ----
const push = (k, v) => { const h = hist[k]; h.push(v); if (h.length > 40) h.shift(); };
async function fast() { const c = await ipc.invoke('cpu'); data.cpu = c; push('cpu', c.load); push('ram', c.ramUsed); update(); }
async function slow() { const g = await ipc.invoke('gpu'); data.gpu = g; if (g) push('gpu', g.load); update(); }
setInterval(fast, 1500); setInterval(slow, 3000); setInterval(pollMusic, 1000);
setInterval(() => H('vol get').then(applyVol), 3000); setInterval(() => { if (S.tab === 'clock') update(); }, 10000);
fast(); slow(); pollMusic(); H('vol get').then(applyVol);
if (navigator.getBattery) navigator.getBattery().then(b => { bat = b; }).catch(() => {});
let rt; function rotate() { clearInterval(rt); if (+S.rotate) rt = setInterval(() => {
 if (isl.classList.contains('open')) return; const v = visible(); S.tab = v[(v.indexOf(S.tab) + 1) % v.length]; tabs(); update(); }, S.rotate * 1000); }

// ---- настройки ----
const ROWS = [
 ['h','Вид'],['range','opacity','Прозрачность',20,100],['range','blur','Размытие фона',0,40],['range','radius','Скругление',10,40],['range','width','Ширина острова',360,500],
 ['check','glow','Свечение (дышит под музыку)'],['check','spark','График нагрузки'],['check','eq','Эквалайзер в плеере'],
 ['select','cover','Обложка',[['square','Квадрат'],['vinyl','Пластинка']]],['check','artColor','Цвета из обложки'],['check','dotLoad','Цвет точки по нагрузке'],['check','alert','Красная точка при перегрузке'],
 ['h','Анимация'],['range','speed','Скорость анимации',30,200],['select','anim','Стиль',[['spring','Пружина'],['smooth','Плавная'],['none','Без анимации']]],
 ['h','Поведение'],['select','open','Раскрытие',[['hover','При наведении'],['click','По клику']]],['select','rotate','Автосмена вкладок',[[0,'Выкл'],[5,'5 сек'],[10,'10 сек'],[20,'20 сек']]],
 ['check','locked','Закрепить положение'],['check','wheel','Колесо мыши = громкость'],['check','h24','24-часовой формат'],
 ['select','sound','Звук таймера',[['beep','Сигнал'],['bell','Колокольчик'],['alarm','Тревога'],['none','Без звука']]]
];
let html = `<div class="hd">Тема</div><label><span>Готовые цвета</span><span style="display:flex;gap:6px;flex-wrap:wrap;flex:1">${Object.keys(T).map(n =>
 `<div class="sw" title="${n}" data-t="${n}" style="background:linear-gradient(135deg,${T[n][0]},${T[n][1]});${n === 'Белый' ? 'background:#f5f5f7' : ''}"></div>`).join('')}</span></label>
 <label><span>Градиенты</span><input type="checkbox" data-k="grad"></label><div class="hd">Свои цвета (по каждому элементу)</div>`;
html += COLS.map(([k, n]) => `<label><span>${n}</span><input type="color" data-c="${k}"><button class="sm" data-cr="${k}">Сброс</button></label>`).join('');
html += ROWS.map(r => r[0] === 'h' ? `<div class="hd">${r[1]}</div>` : r[0] === 'range' ? `<label><span>${r[2]}</span><input type="range" data-k="${r[1]}" min="${r[3]}" max="${r[4]}"></label>`
 : r[0] === 'select' ? `<label><span>${r[2]}</span><select data-k="${r[1]}">${r[3].map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`
 : `<label><span>${r[2]}</span><input type="checkbox" data-k="${r[1]}"></label>`).join('');
html += `<div class="hd">Вкладки</div><label><span></span><span style="display:flex;gap:10px;flex-wrap:wrap;flex:1">${Object.entries(TABS).map(([k, v]) => `<span><input type="checkbox" data-tab="${k}"> ${v}</span>`).join('')}</span></label>
 <div class="hd">Приложение</div><label><span>Запускать с Windows</span><input type="checkbox" id="auto"></label>
 <label><span>Положение</span><button id="ctr">По центру сверху</button></label>
 <label><span></span><button id="rs">Сбросить всё</button><button class="q" id="qt">Выйти</button></label>`;
$('set').innerHTML = html;
function sync() {
 document.querySelectorAll('[data-k]').forEach(e => { const v = S[e.dataset.k]; e.type === 'checkbox' ? e.checked = !!v : e.value = v; });
 document.querySelectorAll('[data-tab]').forEach(e => e.checked = !!S.tabs[e.dataset.tab]);
 document.querySelectorAll('[data-c]').forEach(e => e.value = hex(S.c[e.dataset.c] || dflt(e.dataset.c)));
 document.querySelectorAll('.sw').forEach(e => e.classList.toggle('on', e.dataset.t === S.theme));
}
$('set').addEventListener('input', e => { const t = e.target;
 if (t.dataset.c) { S.c[t.dataset.c] = t.value; save(); theme(); return; }
 if (t.id === 'auto') { ipc.invoke('auto-set', t.checked); return; }
 if (t.dataset.k) { S[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.type === 'range' || t.dataset.k === 'rotate' ? +t.value : t.value; rotate(); }
 else if (t.dataset.tab) { S.tabs[t.dataset.tab] = t.checked ? 1 : 0; tabs(); update(); }
 save(); if (t.dataset.k === 'artColor') artTheme(coverB); if (t.dataset.k === 'locked') tabs(); if (t.dataset.k === 'sound') ring(); theme(); update(); });
$('set').addEventListener('click', e => { const t = e.target;
 if (t.dataset.t) { S.theme = t.dataset.t; S.c = {}; save(); theme(); sync(); }
 if (t.dataset.cr) { delete S.c[t.dataset.cr]; save(); theme(); sync(); }
 if (t.id === 'rs') { Object.assign(S, JSON.parse(JSON.stringify(DEF))); save(); theme(); sync(); tabs(); update(); rotate(); }
 if (t.id === 'ctr') { S.pos = null; save(); ipc.send('center'); }
 if (t.id === 'qt') ipc.send('quit'); });

let t;
const open = () => { clearTimeout(t); isl.classList.add('open'); };

isl.addEventListener('mousedown', e => {
 if (S.locked || e.button !== 0 || e.target.closest('input,select,button,.cb,.tab,.sw,.ib,.set,.vol,.chips,.tin')) return;
 const p = ipc.sendSync('get-pos'); dr = { x: e.screenX, y: e.screenY, px: p[0], py: p[1], m: false };
});
window.addEventListener('mousemove', e => { if (!dr) return; const dx = e.screenX - dr.x, dy = e.screenY - dr.y;
 if (!dr.m && Math.abs(dx) + Math.abs(dy) < 5) return; dr.m = true; isl.classList.add('drag'); ipc.send('set-pos', dr.px + dx, dr.py + dy); });
window.addEventListener('mouseup', () => { if (dr && dr.m) { S.pos = ipc.sendSync('get-pos'); save(); jd = true; setTimeout(() => jd = false, 50); }
 isl.classList.remove('drag'); dr = null; });
if (S.pos) ipc.send('set-pos', S.pos[0], S.pos[1]);
ipc.invoke('auto-get').then(v => { $('auto').checked = !!v; });
theme(); sync(); tabs(); update(); rotate(); tmUi(); volUi();
